<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>MadLena — меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --cream:#fbf4ec; --paper:#fffaf4; --blush:#f6d9d3; --choco:#3b2418; --choco2:#6b4a3a;
  --gold:#c79a55; --gold2:#e7c58c; --rose:#d86f7a; --mint:#9cc9b4; --wa:#25d366;
  --shadow:0 10px 30px -12px rgba(59,36,24,.25);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{
  margin:0;font-family:Manrope,system-ui,sans-serif;color:var(--choco);background:var(--cream);
  background-image:
    radial-gradient(circle at 12% 8%,rgba(246,217,211,.7),transparent 40%),
    radial-gradient(circle at 90% 30%,rgba(231,197,140,.25),transparent 35%),
    radial-gradient(rgba(59,36,24,.06) 1px,transparent 1.2px);
  background-size:auto,auto,18px 18px;
  padding-bottom:calc(110px + env(safe-area-inset-bottom));
}
h1,h2,h3{font-family:"Playfair Display",Georgia,serif;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
.wrap{max-width:920px;margin:0 auto;padding:0 16px}

/* ---------- HERO ---------- */
.hero{position:relative;overflow:hidden;text-align:center;padding:calc(28px + env(safe-area-inset-top)) 16px 26px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.hero .inner{position:relative}
.kicker{letter-spacing:.32em;text-transform:uppercase;font-size:11px;font-weight:700;color:var(--gold)}
.logo{font-style:italic;font-weight:600;font-size:clamp(54px,15vw,92px);line-height:1;margin:6px 0 0;
  background:linear-gradient(100deg,var(--choco) 30%,#8a5a3c 45%,var(--gold) 50%,#8a5a3c 55%,var(--choco) 70%);
  background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s ease-in-out infinite}
@keyframes shine{0%,100%{background-position:100% 0}50%{background-position:0 0}}
.flourish{display:block;margin:2px auto 0;width:180px;height:22px}
.flourish path{stroke:var(--gold);stroke-width:2;fill:none;stroke-dasharray:260;stroke-dashoffset:260;animation:draw 2.2s .3s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.sub{color:var(--choco2);font-size:15px;margin:10px 0 0}
.hero-cake{width:min(280px,72vw);margin:6px auto 0;display:block;animation:bob 4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-1deg)}}
.flame{transform-box:fill-box;transform-origin:50% 100%;animation:flick .5s ease-in-out infinite alternate}
@keyframes flick{from{transform:scale(1,1) rotate(-3deg)}to{transform:scale(.88,1.12) rotate(3deg)}}
.hero-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:8px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 20px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn-dark{background:var(--choco);color:var(--paper);box-shadow:var(--shadow)}
.btn-light{background:var(--paper);color:var(--choco);border:1.5px solid rgba(59,36,24,.15)}
.btn-wa{background:var(--wa);color:#fff;box-shadow:0 10px 24px -10px rgba(37,211,102,.7)}
.dice{display:inline-block}
.btn:hover .dice{animation:roll .6s ease}
@keyframes roll{to{transform:rotate(360deg)}}

/* ---------- CHIPS ---------- */
.chips{position:sticky;top:0;z-index:20;background:rgba(251,244,236,.86);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid rgba(59,36,24,.08);padding-top:env(safe-area-inset-top)}
.chips .row{display:flex;gap:8px;overflow-x:auto;padding:10px 16px;scrollbar-width:none;max-width:920px;margin:0 auto}
.chips .row::-webkit-scrollbar{display:none}
.chip{flex:none;padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px;background:var(--paper);border:1.5px solid rgba(59,36,24,.1);transition:.25s}
.chip.on{background:var(--choco);color:var(--paper);border-color:var(--choco)}

/* ---------- SECTIONS ---------- */
section{padding-top:30px;scroll-margin-top:64px}
.sec-head{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.sec-head h2{font-size:30px;font-weight:700}
.sec-head .line{flex:1;height:10px;background:radial-gradient(circle,var(--gold) 1.6px,transparent 2px) 0 50%/12px 10px repeat-x;opacity:.7}
.sec-note{margin:-8px 0 16px;color:var(--choco2);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:14px}

.card{position:relative;background:var(--paper);border-radius:22px;padding:10px 12px 12px;box-shadow:var(--shadow);border:1px solid rgba(59,36,24,.06);cursor:pointer;
  opacity:0;transform:translateY(26px) scale(.97);transition:opacity .6s ease,transform .6s cubic-bezier(.2,.8,.2,1.2)}
.card.in{opacity:1;transform:none}
.card .art{aspect-ratio:1;margin:-2px -4px 4px;border-radius:16px}
.card .art svg{width:100%;height:100%;display:block;transition:transform .4s cubic-bezier(.3,1.6,.5,1)}
.card:hover .art svg{transform:rotate(-4deg) scale(1.05)}
.card.jelly .art svg{animation:jelly .6s}
@keyframes jelly{30%{transform:scale(1.12,.9)}50%{transform:scale(.94,1.08)}70%{transform:scale(1.04,.97)}100%{transform:none}}
.card h3{font-size:17px;line-height:1.2;font-weight:700}
.card p{margin:5px 0 10px;font-size:13px;line-height:1.4;color:var(--choco2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .bottom{display:flex;align-items:center;justify-content:space-between;gap:6px;min-height:36px}
.price{font-weight:800;font-size:16px;white-space:nowrap}
.price small{font-weight:600;color:var(--choco2);font-size:12px}
.tags{position:absolute;top:12px;left:12px;display:flex;flex-direction:column;gap:4px;z-index:2}
.tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:4px 8px;border-radius:999px;background:var(--choco);color:#fff;width:max-content}
.tag.spicy{background:#c8402c} .tag.kids{background:#5b8fd6}

/* stepper */
.add{width:36px;height:36px;border-radius:50%;background:var(--choco);color:#fff;font-size:22px;line-height:1;display:grid;place-items:center;transition:transform .2s}
.add:active{transform:scale(.85)}
.step{display:flex;align-items:center;background:var(--choco);color:#fff;border-radius:999px;height:36px;animation:pop .3s}
.step button{width:32px;height:36px;font-size:19px;font-weight:700;color:#fff}
.step span{min-width:18px;text-align:center;font-weight:800}
@keyframes pop{0%{transform:scale(.6)}70%{transform:scale(1.08)}}

/* ---------- SHEET ---------- */
.back{position:fixed;inset:0;background:rgba(40,24,16,.45);z-index:50;opacity:0;transition:opacity .3s;backdrop-filter:blur(3px)}
.back.show{opacity:1}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:51;max-width:560px;margin:0 auto;background:var(--paper);border-radius:28px 28px 0 0;
  max-height:92vh;overflow:auto;padding:12px 20px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.9,.25,1)}
.sheet.show{transform:none}
.sheet .grab{width:44px;height:5px;border-radius:9px;background:rgba(59,36,24,.18);margin:0 auto 6px}
.sheet .x{position:absolute;right:14px;top:12px;width:36px;height:36px;border-radius:50%;background:var(--cream);font-size:20px}
.sheet .big{width:min(260px,70vw);margin:0 auto;display:block}
.sheet h3{font-size:28px;text-align:center;margin-top:4px}
.sheet .lead{text-align:center;color:var(--choco2);margin:8px 0 14px;line-height:1.5}
.facts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:14px}
.fact{background:var(--cream);border-radius:12px;padding:8px 12px;font-size:13px}
.fact b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--gold)}
.sheet .buy{display:flex;align-items:center;justify-content:space-between;gap:12px;border-top:1px dashed rgba(59,36,24,.2);padding-top:14px}
.sheet .buy .price{font-size:24px}

/* surprise */
.spin{text-align:center;padding:10px 0 4px}
.spin-art{width:220px;height:220px;margin:0 auto}
.spin-art svg{width:100%;height:100%}
.spin-name{font-size:26px;min-height:34px}
.spin.done .spin-art{animation:jelly .7s}

/* ---------- CART ---------- */
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));z-index:30;max-width:560px;margin:0 auto;
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding:14px 18px;border-radius:20px;background:var(--choco);color:#fff;
  box-shadow:0 18px 40px -14px rgba(59,36,24,.7);transform:translateY(160%);transition:transform .45s cubic-bezier(.2,.9,.25,1.2)}
.bar.show{transform:none}
.bar .bag{display:flex;align-items:center;gap:10px;font-weight:700}
.bar .count{background:var(--gold);color:var(--choco);border-radius:999px;min-width:26px;height:26px;display:grid;place-items:center;font-weight:800;font-size:14px}
.bar.bump .count{animation:pop .4s}
.bar .sum{font-weight:800;font-size:17px}
.dot{position:fixed;z-index:60;width:16px;height:16px;border-radius:50%;background:var(--gold);pointer-events:none;box-shadow:0 0 0 3px #fff}
.line-item{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid rgba(59,36,24,.08)}
.line-item .mini{width:52px;height:52px;flex:none}
.line-item .mini svg{width:100%;height:100%}
.line-item .nm{flex:1;font-weight:700;font-size:15px}
.line-item .nm small{display:block;font-weight:500;color:var(--choco2)}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--cream);border-radius:14px;padding:4px;margin:16px 0 12px}
.seg button{padding:10px 4px;border-radius:11px;font-weight:700;font-size:13.5px}
.seg button.on{background:var(--paper);box-shadow:0 2px 8px rgba(59,36,24,.12)}
.field{display:block;margin-bottom:10px}
.field span{display:block;font-size:12px;font-weight:700;color:var(--choco2);margin:0 0 4px 4px}
.field input,.field textarea{width:100%;font:inherit;font-size:16px;padding:12px 14px;border-radius:14px;border:1.5px solid rgba(59,36,24,.14);background:#fff;color:var(--choco);outline:none}
.field input:focus,.field textarea:focus{border-color:var(--gold)}
.field.err input{border-color:var(--rose);animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.sub-row{display:flex;justify-content:space-between;color:var(--choco2);font-size:14px;margin-top:8px}
.total{display:flex;justify-content:space-between;font-size:20px;font-weight:800;margin:14px 0}
.actions{display:grid;gap:10px}
.actions .btn{justify-content:center}
.phone-note{text-align:center;font-size:13px;color:var(--choco2);margin-top:8px}

.toast{position:fixed;left:50%;top:calc(18px + env(safe-area-inset-top));transform:translate(-50%,-150%);z-index:70;background:var(--choco);color:#fff;padding:12px 18px;border-radius:14px;font-weight:700;font-size:14px;transition:transform .35s;max-width:90vw;text-align:center}
.toast{opacity:0;visibility:hidden}.toast.show{transform:translate(-50%,0);opacity:1;visibility:visible}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:80}

footer{text-align:center;padding:40px 16px 10px;color:var(--choco2);font-size:13px}
footer .logo-s{font-family:"Playfair Display",serif;font-style:italic;font-size:28px;color:var(--choco)}

/* svg ink */
.ink *{stroke:var(--choco);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ink .ns{stroke:none}
.ink .thin{stroke-width:1.4}
.ink .shine{stroke:#fff;stroke-width:2.6;fill:none;opacity:.75}
.steam{fill:none;opacity:0;transform-box:fill-box;animation:steam 3s ease-in-out infinite}
.steam.d2{animation-delay:1s}.steam.d3{animation-delay:2s}
@keyframes steam{0%{transform:translateY(8px);opacity:0}40%{opacity:.7}100%{transform:translateY(-12px);opacity:0}}
.bub{transform-box:fill-box;animation:bub 2.6s ease-in infinite;opacity:0}
@keyframes bub{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(-38px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.card{opacity:1;transform:none}}
</style>
<style>
:root{--cream:#fff6f9;--paper:#fff;--blush:#fde3ee;--choco:#3d2017;--choco2:#7a5a4e;--gold:#e6136a;--gold2:#f6a8c8;--rose:#e6136a;--pink:#e6136a}
body{font-family:Montserrat,system-ui,sans-serif;background:#fff6f9 radial-gradient(rgba(230,19,106,.08) 1px,transparent 1.3px) 0 0/18px 18px}
h1,h2,h3{font-family:Montserrat,system-ui,sans-serif}
.hero{background:var(--pink);color:#fff;border-radius:0 0 34px 34px;padding-bottom:30px}
.hero .rings{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.kicker{color:#ffd1e3}
.logo-svg{display:block;width:min(290px,72vw);margin:8px auto 0;fill:#fff;filter:drop-shadow(0 6px 14px rgba(120,0,50,.25));animation:logoIn 1s cubic-bezier(.2,.9,.3,1.3) both}
@keyframes logoIn{from{opacity:0;transform:translateY(14px) scale(.92)}}
.hero-kz{margin-top:14px;font-weight:800;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#ffd1e3}
.hero-title{font-weight:900;font-size:clamp(32px,9vw,46px);line-height:1;text-transform:uppercase;letter-spacing:-.01em;margin-top:6px}
.hero .sub{color:#ffe6f0;font-weight:500;max-width:420px;margin:12px auto 0}
.hero-cup{width:min(210px,52vw);margin:10px auto 0;display:block;animation:bob 4s ease-in-out infinite}
.promo{display:inline-flex;align-items:center;gap:8px;background:var(--choco);color:#fff;border-radius:999px;padding:8px 18px;font-weight:700;font-size:13px;margin-top:4px;box-shadow:0 10px 24px -12px rgba(0,0,0,.5);transform:rotate(-2deg)}
.promo b{font-size:26px;font-weight:900;line-height:1;color:#ffd1e3}
.hero .btn-dark{background:#fff;color:var(--pink)}
.hero .btn-light{background:transparent;color:#fff;border-color:rgba(255,255,255,.7)}
.btn-dark{background:var(--pink);color:#fff}
.chip{font-weight:700}
.chip.on{background:var(--pink);border-color:var(--pink);color:#fff}
.sec-head h2{font-weight:900;font-size:23px;text-transform:uppercase;letter-spacing:-.01em}
.card{border:1px solid rgba(230,19,106,.1);border-radius:24px}
.card h3{font-weight:800;font-size:15px;line-height:1.25}
.price{color:var(--pink);font-weight:900}
.add,.step{background:var(--pink)}
.bar{background:var(--pink);box-shadow:0 18px 40px -14px rgba(230,19,106,.8)}
.bar .count{background:#fff;color:var(--pink)}
.dot{background:var(--pink)}
.seg button.on{color:var(--pink)}
.sheet h3{font-weight:900;font-size:24px}
.spin-name{font-weight:900}
.field input:focus,.field textarea:focus{border-color:var(--pink)}
footer .logo-s svg{width:170px;fill:var(--pink);display:block;margin:0 auto 6px}
</style>
</head>

let cart={};
try{cart=JSON.parse(localStorage.getItem("madlena-cart")||"{}")||{}}catch(e){cart={}}
const save=()=>{try{localStorage.setItem("madlena-cart",JSON.stringify(cart))}catch(e){}};
const qty=id=>cart[id]||0;
const ctlHTML=id=>qty(id)?`<div class="step"><button data-dec="${id}" aria-label="Меньше">−</button><span>${qty(id)}</span><button data-inc="${id}" aria-label="Больше">+</button></div>`:`<button class="add" data-inc="${id}" aria-label="Добавить">+</button>`;
function setQty(id,q,from){
  const before=qty(id); q=Math.max(0,Math.min(99,q));
  if(q)cart[id]=q;else delete cart[id];save();
  document.querySelectorAll(`[data-ctl="${id}"]`).forEach(el=>el.innerHTML=ctlHTML(id));
  updateBar(q>before);
  if(q>before&&from)flyToBar(from);
  if($("#cartSheet"))renderCart();
}
function bill(){const s=totals().s,fee=order.mode==="table"?Math.round(s*0.1):0;return{s,fee,t:s+fee}}
function totals(){let c=0,s=0;for(const[id,q]of Object.entries(cart)){if(!BY[id])continue;c+=q;s+=q*BY[id].price}return{c,s}}
function updateBar(bump){
  if(!ORDER_MODE)return;const{c,s}=totals();const bar=$("#bar");
  bar.classList.toggle("show",c>0);$("#barCount").textContent=c;$("#barSum").textContent=fmt(s)+" →";
  if(bump){bar.classList.remove("bump");void bar.offsetWidth;bar.classList.add("bump")}
}
function flyToBar(el){
  const a=el.getBoundingClientRect(),b=$("#barCount").getBoundingClientRect();const d=document.createElement("div");d.className="dot";document.body.appendChild(d);
  const x0=a.left+a.width/2-8,y0=a.top+a.height/2-8,x1=b.left+b.width/2-8,y1=(b.top>innerHeight?innerHeight-50:b.top+b.height/2-8);
  d.animate([{transform:`translate(${x0}px,${y0}px) scale(1)`},{transform:`translate(${(x0+x1)/2}px,${Math.min(y0,y1)-90}px) scale(1.3)`,offset:.5},{transform:`translate(${x1}px,${y1}px) scale(.4)`}],{duration:650,easing:"cubic-bezier(.3,.7,.4,1)"}).onfinish=()=>d.remove();
  d.style.left=0;d.style.top=0;
}

function render(){
  $("#heroCake").innerHTML=heroCup();
  $("#chips").innerHTML=MENU.map(s=>`<button class="chip" data-go="${s.id}">${s.title}</button>`).join("");
  $("#menu-start").innerHTML=MENU.map(s=>`<section id="${s.id}"><div class="sec-head"><h2>${s.title}</h2><span class="line"></span></div>${s.note?`<p class="sec-note">${s.note}</p>`:""}
    <div class="grid">${s.items.map(card).join("")}</div></section>`).join("");
  updateBar(false);
}
function card(it){
  return `<article class="card" data-open="${it.id}"><div class="tags">${it.tags.map(t=>`<span class="tag ${TAGS[t][0]}">${TAGS[t][1]}</span>`).join("")}</div>
    <div class="art">${artOf(it)}</div><h3>${it.name}</h3><p>${it.desc}</p>
    <div class="bottom"><span class="price">${fmt(it.price)}</span>${ORDER_MODE?`<div data-ctl="${it.id}">${ctlHTML(it.id)}</div>`:""}</div></article>`;
}

/* sheet */
let closeCurrent=null;
function openSheet(html,id){
  if(closeCurrent)closeCurrent(true);
  const back=document.createElement("div");back.className="back";
  const sh=document.createElement("div");sh.className="sheet";if(id)sh.id=id;
  sh.innerHTML=`<div class="grab"></div><button class="x" aria-label="Закрыть">×</button>`+html;
  document.body.append(back,sh);requestAnimationFrame(()=>{back.classList.add("show");sh.classList.add("show")});
  const close=(fast)=>{back.classList.remove("show");sh.classList.remove("show");closeCurrent=null;setTimeout(()=>{back.remove();sh.remove()},fast?0:450)};
  back.onclick=()=>close();sh.querySelector(".x").onclick=()=>close();closeCurrent=close;return sh;
}
addEventListener("keydown",e=>{if(e.key==="Escape"&&closeCurrent)closeCurrent()});

  const it=BY[id];
  openSheet(`<div class="big">${artOf(it)}</div><h3>${it.name}</h3><p class="lead">${it.desc}</p>
    <div class="buy"><span class="price">${fmt(it.price)}</span>${ORDER_MODE?`<div data-ctl="${id}">${ctlHTML(id)}</div>`:`<span style="color:var(--choco2);font-size:14px">Закажите у официанта</span>`}</div>`);
}

/* удиви меня */
function surprise(){
  const sh=openSheet(`<div class="spin"><div class="kicker">сегодня вам —</div><div class="spin-art"></div><h3 class="spin-name">…</h3><div class="spin-more"></div></div>`);
  const artEl=sh.querySelector(".spin-art"),nm=sh.querySelector(".spin-name");let n=0,delay=55,last;
  const step=()=>{let it;do{it=ITEMS[Math.floor(Math.random()*ITEMS.length)]}while(it===last);last=it;artEl.innerHTML=artOf(it);nm.textContent=it.name;
    if(++n<16){delay*=1.16;setTimeout(()=>sh.isConnected&&step(),delay)}else done(it)};
  const done=it=>{sh.querySelector(".spin").classList.add("done");const r=artEl.getBoundingClientRect();burst(r.left+r.width/2,r.top+r.height/2);
    sh.querySelector(".spin-more").innerHTML=`<p class="lead">${it.desc}</p><div class="hero-actions"><button class="btn btn-dark" data-open="${it.id}">Подробнее · ${fmt(it.price)}</button>${ORDER_MODE?`<button class="btn btn-light" data-inc="${it.id}">+ В заказ</button>`:""}</div>`};
  step();
}

/* корзина */
let order={mode:"table",table:"",time:"",address:"",name:"",comment:""};
function cartText(){
  const lines=Object.entries(cart).filter(([id])=>BY[id]).map(([id,q])=>`• ${BY[id].name} × ${q} — ${fmt(BY[id].price*q)}`);
  const how=order.mode==="table"?`За столиком № ${order.table}`:order.mode==="pickup"?`Самовывоз${order.time?`, к ${order.time}`:""}`:`Доставка: ${order.address}`;
  return `Здравствуйте! Заказ из меню «MadLena»:\n${lines.join("\n")}\n\n${(()=>{const b=bill();return b.fee?`Блюда: ${fmt(b.s)}\nОбслуживание 10%: ${fmt(b.fee)}\nИтого: ${fmt(b.t)}`:`Итого: ${fmt(b.t)}`})()}\n${how}${order.name?`\nИмя: ${order.name}`:""}${order.comment?`\nКомментарий: ${order.comment}`:""}`;
}
function openCart(){openSheet(`<h3>Ваш заказ</h3><div id="cartBody"></div>`,"cartSheet");renderCart()}
function renderCart(){
  const body=$("#cartBody");if(!body)return;const ids=Object.keys(cart).filter(id=>BY[id]);
  if(!ids.length){body.innerHTML=`<p class="lead">Пока пусто. Нажмите «+» у любого блюда 🍽</p>`;return}
  const extra=order.mode==="table"?`<label class="field" id="f-req"><span>Номер столика</span><input inputmode="numeric" data-o="table" value="${esc(order.table)}" placeholder="например, 5"></label>`
    :order.mode==="pickup"?`<label class="field"><span>Ко скольки подойдёте (необязательно)</span><input data-o="time" value="${esc(order.time)}" placeholder="например, 18:30"></label>`
    :`<label class="field" id="f-req"><span>Адрес доставки</span><input data-o="address" value="${esc(order.address)}" placeholder="улица, дом, квартира"></label>`;
  body.innerHTML=ids.map(id=>`<div class="line-item"><div class="mini">${artOf(BY[id])}</div><div class="nm">${BY[id].name}<small>${fmt(BY[id].price)}</small></div><div data-ctl="${id}">${ctlHTML(id)}</div></div>`).join("")+
   `<div class="seg">${[["table","За столиком"],["pickup","Самовывоз"],["delivery","Доставка"]].map(([k,t])=>`<button data-mode="${k}" class="${order.mode===k?"on":""}">${t}</button>`).join("")}</div>
    ${extra}<label class="field"><span>Ваше имя</span><input data-o="name" value="${esc(order.name)}" placeholder="как к вам обращаться" autocomplete="given-name"></label>
    <label class="field"><span>Комментарий</span><input data-o="comment" value="${esc(order.comment)}" placeholder="например, без лука / с собой"></label>
    ${(()=>{const b=bill();return (b.fee?`<div class="sub-row"><span>Блюда</span><span>${fmt(b.s)}</span></div><div class="sub-row"><span>Обслуживание 10%</span><span>${fmt(b.fee)}</span></div>`:"")+`<div class="total"><span>Итого</span><span>${fmt(b.t)}</span></div>`})()}
    <div class="actions"><a class="btn btn-wa" id="waBtn" target="_blank" rel="noopener" href="#">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm5.6 14.2c-.2.7-1.4 1.3-2 1.4-.5 0-1.1.1-3.4-.9-2.9-1.2-4.7-4.1-4.8-4.3-.1-.2-1.2-1.6-1.2-3s.7-2.1 1-2.4c.3-.3.6-.3.8-.3h.6c.2 0 .4 0 .6.5l.9 2.1c.1.2.1.4 0 .6l-.4.6-.4.5c-.1.1-.3.3-.1.6.2.3.8 1.3 1.7 2.1 1.2 1 2.1 1.3 2.4 1.5.3.1.5.1.6-.1l.9-1.1c.2-.3.4-.2.7-.1l2 1c.3.1.5.2.5.4.1.1.1.7-.1 1.3z"/></svg>
      Отправить заказ в WhatsApp</a>
      <a class="btn btn-light" href="tel:+${PHONE_DIGITS}">📞 Позвонить и продиктовать</a>
      <button class="btn btn-light" id="copyBtn">📋 Скопировать заказ</button></div>
    <p class="phone-note">Номер кафе: <b>${PHONE}</b></p>`;
  syncWa();
}
function valid(){const need=order.mode==="table"?order.table.trim():order.mode==="delivery"?order.address.trim():"ok";return !!need}
function syncWa(){const a=$("#waBtn");if(a)a.href=`https://wa.me/${PHONE_DIGITS}?text=${encodeURIComponent(cartText())}`}

/* ================== СОБЫТИЯ ================== */
document.addEventListener("click",e=>{
  const t=e.target.closest("[data-inc],[data-dec],[data-open],[data-go],[data-mode],#surpriseBtn,#bar,#waBtn,#copyBtn");if(!t)return;
  if(t.dataset.inc){e.stopPropagation();setQty(t.dataset.inc,qty(t.dataset.inc)+1,t);return}
  if(t.dataset.dec){e.stopPropagation();setQty(t.dataset.dec,qty(t.dataset.dec)-1);return}
  if(t.dataset.go){document.getElementById(t.dataset.go).scrollIntoView({behavior:"smooth"});return}
  if(t.dataset.mode){order.mode=t.dataset.mode;renderCart();return}
  if(t.id==="surpriseBtn")return surprise();
  if(t.id==="bar")return openCart();
  if(t.id==="waBtn"){if(!valid()){e.preventDefault();const f=$("#f-req");f.classList.remove("err");void f.offsetWidth;f.classList.add("err");f.querySelector("input").focus();toast(order.mode==="table"?"Укажите номер столика":"Укажите адрес доставки")}else toast("Открываем WhatsApp — останется нажать «Отправить»");return}
  if(t.id==="copyBtn"){try{navigator.clipboard.writeText(cartText()).then(()=>toast("Заказ скопирован"),()=>toast("Не получилось скопировать"))}catch(err){toast("Не получилось скопировать")}return}
  if(t.dataset.open){const c=t.closest(".card");if(c){c.classList.remove("jelly");void c.offsetWidth;c.classList.add("jelly");setTimeout(()=>openItem(t.dataset.open),180)}else openItem(t.dataset.open)}
});
document.addEventListener("input",e=>{const k=e.target.dataset.o;if(k){order[k]=e.target.value;e.target.closest(".field").classList.remove("err");syncWa()}});

let tt;function toast(m){const el=$("#toast");el.textContent=m;el.classList.add("show");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("show"),2400)}

/* появление карточек + активная категория */
function observe(){
  const io=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){const el=en.target;const i=[...el.parentNode.children].indexOf(el);el.style.transitionDelay=(i%2)*90+"ms";el.classList.add("in");io.unobserve(el)}}),{threshold:.12});
  document.querySelectorAll(".card").forEach(c=>io.observe(c));
  const spy=new IntersectionObserver(es=>es.forEach(en=>{if(en.isIntersecting){document.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c.dataset.go===en.target.id));const on=document.querySelector(".chip.on");if(on){const row=$("#chips");row.scrollTo({left:on.offsetLeft-row.clientWidth/2+on.clientWidth/2,behavior:"smooth"})}}}),{rootMargin:"-45% 0px -50% 0px"});
  document.querySelectorAll("section").forEach(s=>spy.observe(s));
}

/* посыпка в шапке + конфетти */
const COLORS=["#ffffff","#ffd1e3","#ffe08a","#3d2017","#f7a3c6","#a8d8c0"];
const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function sprinkles(){
  const cv=$("#sprinkles"),ctx=cv.getContext("2d");let W,H,run=true;const dpr=Math.min(devicePixelRatio||1,2);
  const size=()=>{W=cv.clientWidth;H=cv.clientHeight;cv.width=W*dpr;cv.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)};size();addEventListener("resize",size);
  const P=Array.from({length:Math.round(Math.min(46,W/9))},()=>({x:Math.random()*W,y:Math.random()*H,v:.25+Math.random()*.5,r:Math.random()*6,s:(Math.random()-.5)*.04,c:COLORS[Math.random()*COLORS.length|0],w:2.6+Math.random()*2}));
  new IntersectionObserver(([en])=>{run=en.isIntersecting;if(run)loop()}).observe(cv);
  function loop(){if(!run)return;ctx.clearRect(0,0,W,H);for(const p of P){p.y+=p.v;p.r+=p.s;if(p.y>H+10){p.y=-10;p.x=Math.random()*W}ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.globalAlpha=.85;ctx.beginPath();ctx.roundRect?ctx.roundRect(-p.w*2,-p.w/2,p.w*4,p.w,p.w/2):ctx.rect(-p.w*2,-p.w/2,p.w*4,p.w);ctx.fill();ctx.restore()}requestAnimationFrame(loop)}
  if(!reduce)loop();
}
function burst(x,y){
  if(reduce)return;const cv=$("#fx"),ctx=cv.getContext("2d"),dpr=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);
  const P=Array.from({length:70},()=>{const a=Math.random()*Math.PI*2,s=3+Math.random()*7;return{x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-4,r:Math.random()*6,c:COLORS[Math.random()*COLORS.length|0],l:1}});
  (function f(){ctx.clearRect(0,0,innerWidth,innerHeight);let alive=false;for(const p of P){p.vy+=.25;p.x+=p.vx;p.y+=p.vy;p.vx*=.98;p.r+=.2;p.l-=.014;if(p.l>0){alive=true;ctx.save();ctx.globalAlpha=p.l;ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.fillStyle=p.c;ctx.fillRect(-6,-2,12,4);ctx.restore()}}if(alive)requestAnimationFrame(f);else ctx.clearRect(0,0,innerWidth,innerHeight)})();
}

render();observe();sprinkles();
</script>
</body>
